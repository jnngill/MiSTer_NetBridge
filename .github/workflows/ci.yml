name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog and an ARM compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog gcc-arm-linux-gnueabihf

      - name: Testbench
        run: sh tests/run.sh

      - name: Helper builds without warnings
        run: arm-linux-gnueabihf-gcc -O2 -static -Wall -Wextra -Werror -o /tmp/netbridge helper/netbridge.c

      - name: Downloader database matches the files
        run: python3 tools/make_db.py --check
